server:
  port: 8080
  address: 0.0.0.0

spring:
  application:
    name: API-GATEWAY
    cloud:
        gateway:
          globalcors:
            add-to-simple-url-handler-mapping: true

gateway:
  valid-token-url: ${VALID_TOKEN_URL}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URI}

# Cho phép endpoint health được truy cập
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

