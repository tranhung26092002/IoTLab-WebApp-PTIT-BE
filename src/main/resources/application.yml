server:
  port: ${PORT:8081} # Lấy giá trị từ biến môi trường PORT, mặc định là 8081
  servlet:
    context-path: /user

jwt:
  key: ${JWT_KEY} # Lấy từ biến môi trường JWT_KEY, giá trị mặc định là default_jwt_key
  expiration: 86400000

refresh-token:
  expiration: 864000000
  key: ${REFRESH_TOKEN_KEY} # Lấy từ biến môi trường REFRESH_TOKEN_KEY

spring:
  mvc:
    dispatch-options-request: true
  application:
    name: USER-SERVICE
    environment: ${ENVIRONMENT:DEV}
  datasource:
    url: ${POSTGRESQL_DATABASE_URL:jdbc:postgresql://localhost:5432/iot_lab}
    username: ${POSTGRESQL_USERNAME:postgres}
    password: ${POSTGRESQL_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      max-lifetime: ${DB_MAX_LIFETIME:1000000}
  jpa:
    show-sql: ${DEBUG:true}
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        enable_lazy_load_no_trans: true
        temp:
          use_jdbc_metadata_defaults: false
        jdbc:
          lob:
            non_contextual_creation: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: ${DEBUG:true}
  main:
    allow-bean-definition-overriding: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
      enabled: true
      file-size-threshold: 2KB
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

telegram:
  chatId: ${TELEGRAM_CHAT_ID:-1000000000}
  apiToken: ${TELEGRAM_API_TOKEN:-1234567890:ABCDEFGHIJKLMNOPQRSTUVWXYZ}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}

ptit:
  storage-service: ${STORAGE_SERVICE:http://localhost:8086}

brevo:
  api:
    key: ${BREVO_API_KEY}
  sender:
    email: hungtran01686527618@gmail.com
    name: IoT Lab
