server:
  port: 8082
  address: 0.0.0.0
  servlet:
    context-path: /device

spring:
  application:
    name: DEVICE-SERVICE
    environment: ${ENVIRONMENT}

  # Database Configuration
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT}
      maximum-pool-size: ${DB_MAX_POOL_SIZE}
      max-lifetime: ${DB_MAX_LIFETIME}

  jpa:
    show-sql: ${DEBUG}
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        enable_lazy_load_no_trans: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: ${DEBUG}

  # File Upload Configuration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
      enabled: true
      file-size-threshold: 2KB

# RabbitMQ Configuration (Disabled)
rabbitmq:
  enabled: false
  host: ${RABBITMQ_HOST}
  port: ${RABBITMQ_PORT}
  username: ${RABBITMQ_USERNAME}
  password: ${RABBITMQ_PASSWORD}

# Async Configuration
async:
  config:
    core-pool-size: ${ASYNC_CORE_POOL_SIZE}

# Logging Configuration
logging:
  level:
    org.springframework.boot.autoconfigure: INFO
    com.ptit.service: DEBUG

# Eureka Client Configuration
eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URI}
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90
    health-check-url-path: /actuator/health

# External Service URLs
ptit:
  storage-service: ${STORAGE_SERVICE}

# Device Management Configuration
device:
  return:
    notification:
      days: 3
    check:
      cron: 0 0 9 * * ?

# MQTT Configuration for IoT Devices
mqtt:
  broker:
    url: ${MQTT_BROKER_URL}
  client:
    id: ${MQTT_CLIENT_ID}
  username: ${MQTT_USERNAME}
  password: ${MQTT_PASSWORD}
  topic:
    device-register: iot/devices/register
    device-register-response: iot/devices/register/response
    device-data: iot/devices/+/data
    device-status: iot/devices/+/status
    device-commands: iot/devices/+/commands

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    rabbit:
      enabled: false
    db:
      enabled: true
