server:
  port: 8081
  address: 0.0.0.0
  servlet:
    context-path: /user

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000 # 24 hours in milliseconds

refresh-token:
  expiration: 864000000
  key: ${REFRESH_TOKEN_KEY}

spring:
  application:
    name: USER-SERVICE
    environment: ${ENVIRONMENT}

  # Database Configuration
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT}
      maximum-pool-size: ${DB_MAX_POOL_SIZE}
      max-lifetime: ${DB_MAX_LIFETIME}

  jpa:
    show-sql: ${DEBUG}
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        enable_lazy_load_no_trans: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: ${DEBUG}

  # File Upload Configuration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
      enabled: true
      file-size-threshold: 2KB

  # OAuth2 Configuration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/auth/oauth2/callback/google"
            scope:
              - email
              - profile
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID}
            client-secret: ${FACEBOOK_CLIENT_SECRET}
            scope:
              - email
              - public_profile

# RabbitMQ Configuration (Disabled)
rabbitmq:
  enabled: false
  host: ${RABBITMQ_HOST}
  port: ${RABBITMQ_PORT}
  username: ${RABBITMQ_USERNAME}
  password: ${RABBITMQ_PASSWORD}

user:
  exchange: user.exchange
  created:
    queue: user.created.queue
    routing:
      key: user.created
  login:
    exchange: user.login.exchange
    queue: user.login.queue
    routing:
      key: user.login.routing.key

# Async Configuration
async:
  config:
    core-pool-size: ${ASYNC_CORE_POOL_SIZE}

# Logging Configuration
logging:
  level:
    org.springframework.boot.autoconfigure: INFO
    com.ptit.service: DEBUG

# Eureka Client Configuration
eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URI}
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90
    health-check-url-path: /actuator/health

# External Service URLs
ptit:
  storage-service: ${STORAGE_SERVICE}

# Email Service Configuration (Brevo)
brevo:
  api:
    key: ${BREVO_API_KEY}
  sender:
    email: ${BREVO_SENDER_EMAIL}
    name: ${BREVO_SENDER_NAME}

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    rabbit:
      enabled: false
    db:
      enabled: true
