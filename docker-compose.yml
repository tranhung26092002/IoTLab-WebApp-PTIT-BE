version: '3.8'

services:
  eureka-service:
    build: .
    image: eureka-service:latest
    ports:
      - "8761:8761"
    environment:
      - EUREKA_SERVER_ENABLED=true
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
      - EUREKA_CLIENT_FETCH_REGISTRY=false
    networks:
      - ptit-net

networks:
  ptit-net:
    driver: bridge