services:
  postgres:
    container_name: postgres-db
    image: postgres:15
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  rabbitmq:
    container_name: rabbitmq-server
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - .env
    networks:
      - app-network

  eureka-service:
    container_name: eureka-service
    image: tranvanhung26092002/eureka-service:latest
    ports:
      - "8761:8761"
    env_file:
      - .env
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  api-gateway:
    container_name: api-gateway
    image: tranvanhung26092002/api-gateway:latest
    ports:
      - "8080:8080"
    depends_on:
      - eureka-service
    env_file:
      - .env
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  user-service:
    container_name: user-service
    image: tranvanhung26092002/user-service:latest
    ports:
      - "8081:8081"
    depends_on:
      - eureka-service
    env_file:
      - .env
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/user/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  device-service:
    container_name: device-service
    image: tranvanhung26092002/device-service:latest
    ports:
      - "8082:8082"
    depends_on:
      - eureka-service
    env_file:
      - .env
    networks:
      - app-network
    healthcheck:
      test:
        ["CMD", "curl", "-f", "http://localhost:8082/device/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  practice-service:
    container_name: practice-service
    image: tranvanhung26092002/practice-service:latest
    ports:
      - "8083:8083"
    depends_on:
      - eureka-service
    env_file:
      - .env
    networks:
      - app-network
    healthcheck:
      test:
        ["CMD", "curl", "-f", "http://localhost:8083/practice/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  storage-service:
    container_name: storage-service
    image: tranvanhung26092002/storage-service:latest
    ports:
      - "8084:8084"
    depends_on:
      - eureka-service
    env_file:
      - .env
    networks:
      - app-network
    healthcheck:
      test:
        ["CMD", "curl", "-f", "http://localhost:8084/storage/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:

networks:
  app-network:
    external: true
