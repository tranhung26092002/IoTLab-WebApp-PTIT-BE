version: '3.8'

services:
  device-service:
    build:
      context: .  # Đảm bảo context đúng để Dockerfile được sử dụng trong cùng thư mục
    container_name: device-service
    image: device-service:latest
    ports:
      - "8082:8082"
    networks:
      - ptit-net
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

networks:
  ptit-net:
    driver: bridge
