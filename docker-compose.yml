version: '3.8'

services:
  eureka-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eureka-service
    image: eureka-service
    ports:
      - "8761:8761"
    networks:
      - ptit-net
    mem_limit: 200MB
    restart: always

networks:
  ptit-net:
    external:
      name: ptit-net
