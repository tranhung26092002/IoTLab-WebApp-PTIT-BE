version: '3.8'

services:
  storage-service:
    build:
      context: .  # Đảm bảo context đúng để Dockerfile được sử dụng trong cùng thư mục
    container_name: storage-service
    image: storage-service:latest
    ports:
      - "8086:8086"
    volumes:
      - /opt/storage-service/uploads:/uploads # Bind Mount
    networks:
      - ptit-net
    restart: always

networks:
  ptit-net:
    driver: bridge