version: '3.8'

services:
  practice-service:
    build:
      context: .  # Đảm bảo context đúng để Dockerfile được sử dụng trong cùng thư mục
    container_name: practice-service
    image: practice-service:latest
    ports:
      - "8084:8084"
    networks:
      - ptit-net
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

networks:
  ptit-net:
    driver: bridge
