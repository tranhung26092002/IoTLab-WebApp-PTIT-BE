version: '3.8'

services:
  eureka-service:
    build: .
    image: eureka-service:latest
    container_name: eureka-service
    ports:
      - "8761:8761"
    networks:
      - ptit-net
    restart: always
    environment:
      - "JAVA_OPTS=-Xmx512m -Xms256m"

networks:
  ptit-net:
    driver: bridge