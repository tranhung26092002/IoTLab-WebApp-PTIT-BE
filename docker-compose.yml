version: '3.8'

services:
  user-service:
    build:
      context: .  # Đảm bảo context đúng để Dockerfile được sử dụng trong cùng thư mục
    container_name: user-service
    ports:
      - "8081:8081"
    networks:
      - ptit-net
    restart: always
    environment:
      - JWT_KEY=${JWT_KEY}
      - REFRESH_TOKEN_KEY=${REFRESH_TOKEN_KEY}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - BREVO_API_KEY=${BREVO_API_KEY}

networks:
  ptit-net:
    driver: bridge
