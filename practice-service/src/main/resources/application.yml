server:
  port: 8083
  address: 0.0.0.0
  servlet:
    context-path: /practice

spring:
  application:
    name: PRACTICE-SERVICE
    environment: ${ENVIRONMENT}

  # Database Configuration
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT}
      maximum-pool-size: ${DB_MAX_POOL_SIZE}
      max-lifetime: ${DB_MAX_LIFETIME}

  jpa:
    show-sql: ${DEBUG}
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        enable_lazy_load_no_trans: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: ${DEBUG}

  # File Upload Configuration
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
      enabled: true
      file-size-threshold: 10KB

# RabbitMQ Configuration (Disabled)
rabbitmq:
  enabled: false
  host: ${RABBITMQ_HOST}
  port: ${RABBITMQ_PORT}
  username: ${RABBITMQ_USERNAME}
  password: ${RABBITMQ_PASSWORD}

# Async Configuration
async:
  config:
    core-pool-size: ${ASYNC_CORE_POOL_SIZE}

# Logging Configuration
logging:
  level:
    org.springframework.boot.autoconfigure: INFO
    com.ptit.service: DEBUG

# Eureka Client Configuration
eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URI}
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90
    health-check-url-path: /actuator/health

# External Service URLs
ptit:
  storage-service: ${STORAGE_SERVICE}

user:
  exchange: user.exchange
  created:
    queue: user.created.queue
    routing:
      key: user.created
  login:
    exchange: user.login.exchange
    queue: user.login.queue
    routing:
      key: user.login.routing.key

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    rabbit:
      enabled: false
    db:
      enabled: true
