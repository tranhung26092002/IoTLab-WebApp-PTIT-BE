server:
  port: 8084
  address: 0.0.0.0

  servlet:
    context-path: /practice
spring:
  mvc:
    dispatch-options-request: true
    pathmatch:
      matching-strategy: ant_path_matcher
  application:
    name: PRACTICE-SERVICE
    environment: ${ENVIRONMENT}
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT}
      maximum-pool-size: ${DB_MAX_POOL_SIZE}
      max-lifetime: ${DB_MAX_LIFETIME}
  jpa:
    show-sql: ${DEBUG}
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        enable_lazy_load_no_trans: true
        temp:
          use_jdbc_metadata_defaults: false
        jdbc:
          lob:
            non_contextual_creation: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: ${DEBUG}
  main:
    allow-bean-definition-overriding: true
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
      enabled: true
      file-size-threshold: 10KB
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  packages-to-scan: com.ptit.service.controller

telegram:
  chatId: ${TELEGRAM_CHAT_ID}
  apiToken: ${TELEGRAM_API_TOKEN}
debug: ${DEBUG}

async:
  config:
    core-pool-size: ${ASYNC_CORE_POOL_SIZE}
logging:
  level:
    org:
      springframework:
        boot:
          autoconfigure: INFO
eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URI}

ptit:
  storage-service: ${STORAGE_SERVICE}

# User Service RabbitMQ Configuration
user:
  exchange: user.exchange
  created:
    queue: user.created.queue
    routing:
      key: user.created
  login:
    exchange: user.login.exchange
    queue: user.login.queue
    routing:
      key: user.login.routing.key
